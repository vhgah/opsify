name: Deploy Opsify to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1️⃣ Checkout source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Login GHCR bằng GITHUB_TOKEN
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4️⃣ Build & push image (tag = github.sha)
      - name: Build and push image
        run: |
          TAG=${{ github.sha }}

          echo "Building image with TAG=$TAG"

          docker build \
            -f Dockerfile.prod \
            -t ghcr.io/${{ github.repository_owner }}/opsify:${TAG} \
            .

          docker push ghcr.io/${{ github.repository_owner }}/opsify:${TAG}

      # 5️⃣ SSH vào VPS và deploy
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.77.108.5
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u vhgah --password-stdin

            cd /root/app/shopify-app

            export TAG=${{ github.sha }}
            echo "Deploying opsify with TAG=$TAG"

            docker compose -f docker-compose.prod.yml pull opsify
            docker compose -f docker-compose.prod.yml up -d --no-deps opsify

            docker image prune -f